# Raisebook: the whole stack on one host (SPEC §11). raisebook.org runs this file; see
# docs/DEPLOY.md.
#
#   cp deploy/.env.example deploy/.env      # then set your hosts and secrets
#   GIT_SHA=$(git rev-parse --short HEAD) docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml up -d
#
# Services: postgres (data volume), migrate (one-shot alembic upgrade), api (FastAPI + /mcp),
# worker (background jobs: AI research runs, profile prefill, removals), web (Next.js), caddy
# (TLS + reverse proxy). Only caddy publishes ports. Every container's log is capped at
# 5 x 20 MB, so a traffic spike cannot fill the disk.

name: raisebook

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-api-env: &api-env
  RAISEBOOK_ENVIRONMENT: ${RAISEBOOK_ENVIRONMENT:-production}
  RAISEBOOK_DATABASE_URL: postgresql://${POSTGRES_USER:-raisebook}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-raisebook}
  RAISEBOOK_DB_POOL_SIZE: ${RAISEBOOK_DB_POOL_SIZE:-5}
  RAISEBOOK_PUBLIC_BASE_URL: https://${API_HOST:-api.raisebook.org}
  RAISEBOOK_APP_URL: https://${WEB_HOST:-raisebook.org}
  RAISEBOOK_CORS_ORIGINS: ${RAISEBOOK_CORS_ORIGINS:-[]}
  RAISEBOOK_SESSION_SECRET: ${RAISEBOOK_SESSION_SECRET:?set RAISEBOOK_SESSION_SECRET in deploy/.env}
  RAISEBOOK_SESSION_COOKIE_DOMAIN: ${RAISEBOOK_SESSION_COOKIE_DOMAIN:-raisebook.org}
  RAISEBOOK_SESSION_COOKIE_SECURE: "true"
  RAISEBOOK_GOOGLE_CLIENT_ID: ${RAISEBOOK_GOOGLE_CLIENT_ID:-}
  RAISEBOOK_GOOGLE_CLIENT_SECRET: ${RAISEBOOK_GOOGLE_CLIENT_SECRET:-}
  RAISEBOOK_EMAIL_BACKEND: ${RAISEBOOK_EMAIL_BACKEND:-smtp}
  RAISEBOOK_EMAIL_FROM: ${RAISEBOOK_EMAIL_FROM:-Raisebook <login@raisebook.org>}
  RAISEBOOK_SMTP_HOST: ${RAISEBOOK_SMTP_HOST:-}
  RAISEBOOK_SMTP_PORT: ${RAISEBOOK_SMTP_PORT:-587}
  RAISEBOOK_SMTP_USERNAME: ${RAISEBOOK_SMTP_USERNAME:-}
  RAISEBOOK_SMTP_PASSWORD: ${RAISEBOOK_SMTP_PASSWORD:-}
  RAISEBOOK_SMTP_STARTTLS: ${RAISEBOOK_SMTP_STARTTLS:-true}
  RAISEBOOK_RATE_LIMIT_BACKEND: ${RAISEBOOK_RATE_LIMIT_BACKEND:-postgres}
  RAISEBOOK_MAX_WORKSPACES_PER_USER: ${RAISEBOOK_MAX_WORKSPACES_PER_USER:-10}
  RAISEBOOK_WORKSPACE_LIMIT_EXEMPT_EMAILS: ${RAISEBOOK_WORKSPACE_LIMIT_EXEMPT_EMAILS:-}
  RAISEBOOK_LOG_LEVEL: ${RAISEBOOK_LOG_LEVEL:-INFO}
  RAISEBOOK_LOG_JSON: "true"
  # Sign-in links per client IP per hour (default 100; raise it for an event on shared
  # Wi-Fi) and all outbound email per hour (default 500; keep it under your email plan).
  RAISEBOOK_MAGIC_LINKS_PER_IP_HOUR: ${RAISEBOOK_MAGIC_LINKS_PER_IP_HOUR:-}
  RAISEBOOK_EMAIL_GLOBAL_PER_HOUR: ${RAISEBOOK_EMAIL_GLOBAL_PER_HOUR:-}
  # AI research stays off unless switched on in deploy/.env (docs/DEPLOY.md "AI research").
  # api and worker both need the same RAISEBOOK_SECRETS_KEK.
  RAISEBOOK_RESEARCH_ENABLED: ${RAISEBOOK_RESEARCH_ENABLED:-false}
  RAISEBOOK_SECRETS_KEK: ${RAISEBOOK_SECRETS_KEK:-}
  RAISEBOOK_SECRETS_KEK_PREVIOUS: ${RAISEBOOK_SECRETS_KEK_PREVIOUS:-}
  RAISEBOOK_OPERATOR_EMAIL: ${RAISEBOOK_OPERATOR_EMAIL:-}
  RAISEBOOK_WORKER_CONCURRENCY: ${RAISEBOOK_WORKER_CONCURRENCY:-4}

services:
  postgres:
    logging: *logging
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raisebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-raisebook}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  migrate:
    logging: *logging
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: raisebook-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    logging: *logging
    image: raisebook-api:local
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  worker:
    logging: *logging
    # Background job runner. Same image as the api, no ports. It serves no HTTP, so the
    # image's /healthz check is turned off here (it would always report unhealthy).
    image: raisebook-api:local
    command: ["rbctl", "worker"]
    healthcheck:
      disable: true
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # SIGTERM gives running jobs RAISEBOOK_WORKER_GRACE_S (50 s), then hands them back.
    stop_grace_period: 60s
    networks: [internal]

  web:
    logging: *logging
    build:
      context: ../web
      dockerfile: ../deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST:-api.raisebook.org}
        NEXT_PUBLIC_SITE_URL: https://${WEB_HOST:-raisebook.org}
        NEXT_PUBLIC_PUBLIC_API_URL: https://${API_HOST:-api.raisebook.org}
        NEXT_PUBLIC_REPO_URL: ${NEXT_PUBLIC_REPO_URL:-https://github.com/gumruyanzh/raisebook}
        # Empty hides every "Support Raisebook" button (set it once GitHub Sponsors is live).
        NEXT_PUBLIC_SPONSOR_URL: ${NEXT_PUBLIC_SPONSOR_URL:-}
        GIT_SHA: ${GIT_SHA:-}
    image: raisebook-web:local
    restart: unless-stopped
    environment:
      # Server components reach the API over the compose network, not the public internet.
      API_URL_INTERNAL: http://api:8000
    depends_on:
      - api
    networks: [internal]

  caddy:
    logging: *logging
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_HOST: ${WEB_HOST:-raisebook.org}
      API_HOST: ${API_HOST:-api.raisebook.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    # Fixed subnet: the API trusts X-Forwarded-For only from here (FORWARDED_ALLOW_IPS in
    # api.Dockerfile). Change both together.
    ipam:
      config:
        - subnet: 172.30.0.0/24
