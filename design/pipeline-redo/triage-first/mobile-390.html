<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed on a phone</title>
<link rel="stylesheet" href="mock.css">
<style>
  body { width: 390px; height: 844px; overflow: hidden; position: relative; }
  .mtop { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .mtop .wordmark { font-size: 18px; }
  .p { padding: 0 16px; }
  .trow { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .seg { height: 30px; font-size: 13px; }
  .seg > * { padding: 0 9px; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .prog { height: 3px; background: var(--sunk); border-radius: 999px; margin-top: 8px; }
  .file { margin-top: 12px; padding: 16px; }
  .name { font: 700 24px/1.1 var(--f-display); letter-spacing: -.02em; }
  .sub { color: var(--muted); margin-top: 3px; }
  .chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .lb { height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; display: inline-flex; align-items: center; color: var(--accent); font-size: 13px; font-weight: 500; }
  .facts { display: grid; grid-template-columns: 88px 1fr; gap: 5px 10px; font-size: 13px; margin-top: 12px; }
  .facts dt { color: var(--muted); }
  .note { font-size: 13px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .upnext { margin-top: 12px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  .upnext div { display: flex; gap: 8px; align-items: center; }
  .dock { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px 26px; display: flex; flex-direction: column; gap: 8px; }
  .mv3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mv { height: 48px; border: 1px solid var(--line); border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 600; font-size: 14px; background: var(--surface); }
  .mv.sm { height: 40px; font-weight: 500; font-size: 13.5px; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; }

  .led { margin-top: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .amount { font: 700 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
  .amount span { font: 500 15px var(--f-display); color: var(--muted); }
  .nx { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 8px; align-items: center; min-height: 40px; border-top: 1px solid var(--line); font-size: 13.5px; }
  .sh { height: 44px; display: flex; align-items: center; gap: 9px; border-top: 1px solid var(--line); font-weight: 600; font-size: 14px; }
  .sh .n { font: 400 12px var(--f-mono); color: var(--muted); }
  .sh .r { margin-left: auto; display: flex; gap: 10px; align-items: center; font: 400 12px var(--f-mono); color: var(--muted); }
  .chev { width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); display: inline-block; }
  .chev.d { transform: rotate(45deg); }
  .lr { min-height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 6px 0 6px 18px; border-top: 1px solid color-mix(in oklab, var(--line) 60%, transparent); }
  .lr .l1, .lr .l2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .lr .l2 { font-size: 12.5px; color: var(--muted); }
  .lr .chip, .lr .pips { margin-left: auto; }
</style>
</head>
<body>
<script src="data.js"></script>
<header class="mtop">
  <span class="wordmark">Raisebook</span>
  <span class="ws" style="font-size:13.5px">Lumen Health <i class="caret"></i></span>
  <span class="btn sm" style="margin-left:auto">Menu</span><span class="avatar">F</span>
</header>
<main id="root"></main>
<script>
  const v = new URLSearchParams(location.search).get("v") || "triage";
  const root = document.getElementById("root");
  const inv = INV;
  if (v === "triage") {
    const c = inv[0];
    root.innerHTML = `
    <div class="p">
      <div class="trow"><span class="title">Seed</span><span class="seg" style="margin-left:auto"><span class="on">Triage <span class="cnt">411</span></span><span>Board</span><span>List</span></span></div>
      <div class="meta"><span class="micro"><span style="color:var(--fg)">1</span> of 411 · highest fit first</span><span class="btn sm" style="margin-left:auto">Filter</span></div>
      <div class="prog"></div>
      <section class="panel file">
        <div class="name">${c.name}</div>
        <div class="sub">${c.title} · ${c.firm}</div>
        <div class="chips">${prioChip(c.fit)}${pips(c.fit)}<span class="chip type">${c.type}</span><span class="chip tag">SF Tech Week</span></div>
        <div style="display:flex;gap:6px;margin-top:12px"><span class="lb">Email · copy</span><span class="lb">LinkedIn ↗</span><span class="lb">Website ↗</span></div>
        <dl class="facts"><dt>Check size</dt><dd class="mono" style="font-size:12.5px">$100k–$500k</dd><dt>Invests at</dt><dd>Pre-seed, Seed</dd><dt>Location</dt><dd>San Francisco</dd></dl>
        <div class="note">Talked at the health-infra dinner on Thursday. Wants to see the pilot numbers before a first call. Knows Harper from the Juniper angel group.</div>
      </section>
      <div class="upnext"><span class="label">Up next</span>
        ${inv.slice(1, 3).map((x) => `<div><span style="color:var(--fg);font-weight:500">${x.name}</span><span class="ell">${x.firm}</span><span style="margin-left:auto">${pips(x.fit, true)}</span></div>`).join("")}
      </div>
    </div>
    <div class="dock">
      <div class="mv3">
        <span class="mv"><i class="dot s-violet"></i>Research</span>
        <span class="mv"><i class="dot s-cobalt"></i>Contacted</span>
        <span class="mv"><i class="dot s-gray"></i>Pass</span>
      </div>
      <div class="mv3">
        <span class="mv sm">Skip</span>
        <span class="mv sm">Follow up</span>
        <span class="mv sm">Other stage</span>
      </div>
      <div class="hint">Each tap saves, opens the next investor and offers Undo.</div>
    </div>`;
  } else {
    let h = 7; const r = () => ((h = (h * 1103515245 + 12345) % 2147483648) / 2147483648);
    const pool = inv.map((x) => [x, r()]).sort((a, b) => a[1] - b[1]).map((a) => a[0]).filter((x) => x.fit >= 3);
    const rows = [["Overdue 4d", "due"], ["Today", "due"], ["Oct 14", "soon"], ["Oct 16", "soon"]];
    const C = { new: 38, res: 64, con: 52, rep: 14, mtg: 9, dd: 0, com: 4, pas: 230 };
    const sec = (s, extra = "", open = false) => `<div class="sh"><i class="dot s-${s.c}"></i>${s.label}<span class="n">${C[s.k]}</span><span class="r">${extra}<i class="chev${open ? " d" : ""}"></i></span></div>`;
    const S = Object.fromEntries(STAGES.map((s) => [s.k, s]));
    root.innerHTML = `
    <div class="p">
      <div class="trow"><span class="title">Seed</span><span class="seg" style="margin-left:auto"><span>Triage <span class="cnt">38</span></span><span>Board</span><span class="on">List</span></span></div>
      <section class="panel led">
        <span class="label">Committed toward Seed</span>
        <div class="amount">$650,000 <span>of $2,000,000</span></div>
        <div class="meter"><i style="width:32.5%"></i></div>
        <div style="font-size:13px" class="muted"><b style="color:var(--fg);font-weight:600">$400k</b> soft · <b style="color:var(--fg);font-weight:600">41</b> days left</div>
      </section>
      <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:baseline"><span class="label">Next up</span><span class="link" style="font-size:13px">All 12 →</span></div>
      <div style="margin-top:6px">
        <div class="nx" style="border-top:0"><span class="chip due" style="justify-self:start">Overdue 4d</span><span class="ell"><b style="font-weight:600">Harper Lockwood</b> <span class="muted">· Data room</span></span></div>
        <div class="nx"><span class="chip due" style="justify-self:start">Today</span><span class="ell"><b style="font-weight:600">Kai Merriman</b> <span class="muted">· Allocation call</span></span></div>
        <div class="nx"><span class="chip hot" style="justify-self:start">Fit 5 · new</span><span class="ell"><b style="font-weight:600">Rhea Calloway</b> <span class="muted">· Not contacted</span></span></div>
      </div>
      <div style="margin-top:12px">
        ${sec(S.new, '<span class="link" style="font:500 13px var(--f-body)">Triage →</span>')}
        ${sec(S.res)}
        ${sec(S.con)}
        ${sec(S.rep, '<span style="color:var(--bad)">1 due</span>')}
        ${sec(S.mtg, '<span style="color:var(--bad)">2 due</span>', true)}
        ${pool.slice(0, 4).map((x, i) => `<div class="lr"><div class="l1">${x.fit === 5 ? '<i class="prio hot"></i>' : x.fit === 4 ? '<i class="prio warm"></i>' : ""}<b style="font-weight:600" class="ell">${x.name}</b><span class="chip ${rows[i][1]}">${rows[i][0]}</span></div><div class="l2"><span class="ell">${x.firm || "Angel"}</span>${pips(x.fit, true)}</div></div>`).join("")}
        ${sec(S.dd)}
        ${sec(S.com, '<span style="color:var(--good-ink)">$650k</span>')}
      </div>
    </div>`;
  }
</script>
</body>
</html>
