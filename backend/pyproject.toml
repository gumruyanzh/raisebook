[project]
name = "raisebook"
version = "0.2.0"
description = "Raisebook: a free-forever, open-source fundraising CRM for founders, with an MCP server"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136,<0.137",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.50,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28,<0.29",
    "mcp>=1.23,<2",
    "structlog>=24.4",
    "typer>=0.15",
    "pyjwt[crypto]>=2.10",
    "cryptography>=43",
]

[project.scripts]
rbctl = "raisebook.cli:app"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raisebook"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "S105", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"alembic/**" = ["E501", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["raisebook", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "raisebook.auth.*",
    "raisebook.core.secrets",
    "raisebook.services.normalize",
    "raisebook.services.csv_io",
    "raisebook.services.jobs",
    "raisebook.services.spend",
]
strict = true
