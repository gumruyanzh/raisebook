name: Bug report
description: Something in Raisebook is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please never paste real investor data, API keys or sign-in links here.
        Security problems go through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a round
        2. ...
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - raisebook.org (web app)
        - MCP server / agent
        - REST API
        - Self-hosted copy
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, device or MCP client
      placeholder: Safari on iPhone 15, Claude Code 2.x, ...
  - type: input
    id: request
    attributes:
      label: Request id (if an error showed one)
